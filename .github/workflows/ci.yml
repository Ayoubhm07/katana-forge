name: Forge Gate

# Every pull request and every push to main passes the whole gate. The final "Forge Gate" job is the single
# required status check: main never moves unless all of it is green.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Manifests, agents, skill, plan, commands, ownership
        run: python scripts/validate_plugin.py
      - name: Voice lock
        run: python scripts/voice_lock.py
      - name: SVG gate
        run: python scripts/check_svg.py
      - name: Vendor integrity
        run: python scripts/vendor_integrity.py
      - name: Design database smoke test
        run: python scripts/smoke_search.py

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  links:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path node_modules --exclude-path skills/katana-forge/vendor './**/*.md'
          fail: true

  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install into a scratch Claude home (bash)
        if: runner.os != 'Windows'
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude-home"
          bash install.sh
          test -f "$CLAUDE_HOME/skills/katana-forge/SKILL.md"
          test -f "$CLAUDE_HOME/skills/katana-forge/PLAN.md"
          test -f "$CLAUDE_HOME/commands/forge.md"
          test "$(find "$CLAUDE_HOME/agents" -name 'katana-*.md' | wc -l | tr -d ' ')" = "8"
      - name: Install into a scratch Claude home (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_HOME = Join-Path $env:RUNNER_TEMP "claude-home"
          ./install.ps1
          if (-not (Test-Path "$env:CLAUDE_HOME/skills/katana-forge/SKILL.md")) { throw "skill missing" }
          if (-not (Test-Path "$env:CLAUDE_HOME/commands/forge.md")) { throw "command missing" }
          $count = (Get-ChildItem "$env:CLAUDE_HOME/agents/katana-*.md").Count
          if ($count -ne 8) { throw "expected 8 agents, found $count" }

  scripts:
    name: Shell and PowerShell analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck install.sh scripts/check-all.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) issue(s)" }

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: zizmor (GitHub Actions security audit)
        run: |
          python -m pip install --disable-pip-version-check zizmor==1.30.1
          zizmor --persona=regular --format=plain .github/workflows

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks on the full history (official binary, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  gate:
    name: Forge Gate
    if: always()
    needs: [plugin, docs, spelling, links, installers, scripts, workflows, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq '[.[] | select(.result != "success")] | length')
          {
            echo "## Forge Gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo ""
            if [ "$failed" -ne 0 ]; then
              echo "**NOT YET.** $failed check(s) failed. main stays untouched."
            else
              echo "**MASTERPIECE.** Every check is green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
