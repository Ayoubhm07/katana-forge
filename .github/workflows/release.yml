name: Release

# Tag vX.Y.Z on main: the plugin is packed, checksummed, given a signed build provenance attestation,
# and published as a GitHub release. Anyone can verify it with: gh attestation verify <zip> -R Ayoubhm07/katana-forge

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Pack, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Gate before packing
        run: |
          python scripts/validate_plugin.py
          python scripts/vendor_integrity.py
          python scripts/check_svg.py
      - name: Check the tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$version" = "$TAG"
      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix="katana-forge/" -o "katana-forge-$TAG.zip" HEAD
          sha256sum "katana-forge-$TAG.zip" > "katana-forge-$TAG.zip.sha256"
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: katana-forge-${{ github.ref_name }}.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "katana-forge-$TAG.zip" "katana-forge-$TAG.zip.sha256" --title "Katana Forge $TAG" --notes-file CHANGELOG.md --verify-tag
